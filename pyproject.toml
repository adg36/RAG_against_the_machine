[project]
name = "rag"
version = "0.1.0"
description = "A Retrieval Augmented Generation project at 42 Porto"
readme = "README.md"
authors = [
	{ name = "razevedo", email = "razevedo@student.42porto.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.16",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.3",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]
